# Cloud Monitoring Alerts Configuration
# SCALE-CORE-002 - Observabilidad End-to-End
# 
# Uso: gcloud alpha monitoring policies create --policy-from-file=alert-policies.yaml
# Referencia: https://cloud.google.com/monitoring/alerts/policies-in-json

# ============================================================================
# INSTRUCCIONES DE CONFIGURACIÓN
# ============================================================================
# 
# 1. Configurar canal de notificación (email):
#    gcloud alpha monitoring channels create --display-name="Portfolio Alerts Email" \
#      --type=email --channel-labels=email_address=tu-email@example.com
#
# 2. Obtener el ID del canal:
#    gcloud alpha monitoring channels list
#
# 3. Reemplazar NOTIFICATION_CHANNEL_ID en las políticas abajo
#
# 4. Crear las políticas:
#    gcloud alpha monitoring policies create --policy-from-file=policy-error-rate.json
#
# ============================================================================

---
# Política 1: High Error Rate
# Archivo: policy-error-rate.json
# Condición: Más de 5 errores por minuto en Cloud Functions

displayName: "Cloud Functions - High Error Rate"
documentation:
  content: "Error rate is above 5 errors per minute. Check Cloud Logging for details."
  mimeType: "text/markdown"
conditions:
  - displayName: "Error rate > 5/min"
    conditionThreshold:
      filter: >
        resource.type="cloud_function"
        AND severity="ERROR"
      comparison: COMPARISON_GT
      thresholdValue: 5
      duration: "60s"
      aggregations:
        - alignmentPeriod: "60s"
          perSeriesAligner: ALIGN_RATE
combiner: OR
enabled: true
# notificationChannels:
#   - projects/portafolio-inversiones/notificationChannels/NOTIFICATION_CHANNEL_ID

---
# Política 2: Scheduled Job Failed
# Archivo: policy-scheduled-failed.json

displayName: "Scheduled Job - unifiedMarketDataUpdate Failed"
documentation:
  content: "The unifiedMarketDataUpdate scheduled function has failed. Check Cloud Logging."
  mimeType: "text/markdown"
conditions:
  - displayName: "Function execution failed"
    conditionThreshold:
      filter: >
        resource.type="cloud_function"
        AND resource.labels.function_name="unifiedMarketDataUpdateV2"
        AND severity="ERROR"
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: "0s"
combiner: OR
enabled: true

---
# Política 3: High Latency
# Archivo: policy-high-latency.json

displayName: "Cloud Functions - High Latency (>10s)"
documentation:
  content: "P95 latency is above 10 seconds for critical functions."
  mimeType: "text/markdown"
conditions:
  - displayName: "P95 latency > 10s"
    conditionThreshold:
      filter: >
        resource.type="cloud_function"
        AND resource.labels.function_name=one_of("getHistoricalReturns", "createAsset", "sellAsset", "getCurrentPricesForUser")
        AND metric.type="cloudfunctions.googleapis.com/function/execution_times"
      comparison: COMPARISON_GT
      thresholdValue: 10000
      duration: "300s"
      aggregations:
        - alignmentPeriod: "60s"
          perSeriesAligner: ALIGN_PERCENTILE_95
combiner: OR
enabled: true

---
# Política 4: Function Timeout Warning
# Archivo: policy-timeout.json

displayName: "Cloud Functions - Near Timeout (>50s)"
documentation:
  content: "Function execution time is approaching the 60s timeout limit."
  mimeType: "text/markdown"
conditions:
  - displayName: "Execution time > 50s"
    conditionThreshold:
      filter: >
        resource.type="cloud_function"
        AND metric.type="cloudfunctions.googleapis.com/function/execution_times"
      comparison: COMPARISON_GT
      thresholdValue: 50000
      duration: "0s"
combiner: OR
enabled: true

---
# Política 5: El cierre nocturno dejó inversores fuera (HU 6.3, RN-6.3-N)
# Archivo: policy-eod-incompleto.json
#
# Es el aviso del Escenario 4. El cierre póstomo escribe `[EOD-INCOMPLETO]` en
# el log cuando uno o más inversores no quedaron con su rendimiento del día ni
# siquiera tras los reintentos. El detalle —cuántos, cuáles y por qué— queda en
# la colección `eodFailures/{fecha}` de Firestore.
#
# IMPORTANTE: el prefijo del log es el contrato. Si se cambia en
# services/eodFinalizationScheduled.js (PREFIJO_ALERTA), hay que cambiarlo aquí.

displayName: "EOD - Inversores sin rendimiento del día"
documentation:
  content: |
    El cierre nocturno terminó con inversores sin su rendimiento del día.
    Detalle en Firestore: `eodFailures/{YYYY-MM-DD}` (cuántos, cuáles y por qué).
    La reconciliación de las 02:00 ET reintenta a los marcados `_stale`.
  mimeType: "text/markdown"
conditions:
  - displayName: "Log con [EOD-INCOMPLETO]"
    conditionMatchedLog:
      filter: >
        resource.type="cloud_run_revision"
        AND severity="ERROR"
        AND textPayload:"[EOD-INCOMPLETO]"
alertStrategy:
  notificationRateLimit:
    period: "3600s"
combiner: OR
enabled: true

---
# Política 6: Scheduled Job Failed — cierre póstumo (HU 6.3, T6)
# Archivo: policy-eod-finalization-failed.json
#
# Si el cierre póstumo no corre, los pasos globales del día no se ejecutan y
# —peor— nadie comprueba si alguien quedó fuera: el fallo volvería a ser
# silencioso, que es justo lo que la HU 6.3 viene a quitar.

displayName: "Scheduled Job - scheduledEodFinalization Failed"
documentation:
  content: "El cierre póstumo del EOD ha fallado. Sin él, nadie comprueba si algún inversor quedó fuera."
  mimeType: "text/markdown"
conditions:
  - displayName: "Function execution failed"
    conditionThreshold:
      filter: >
        resource.type="cloud_function"
        AND resource.labels.function_name="scheduledEodFinalization"
        AND severity="ERROR"
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: "0s"
combiner: OR
enabled: true

---
# Política 7: Tasa de fallo alta en las tareas por inversor (HU 6.3, T3)
# Archivo: policy-eod-task-errors.json
#
# Una tarea que falla y se reintenta es normal. Muchas a la vez no lo es: suele
# significar que el documento del día no se materializó o que Firestore está
# rechazando escrituras, y en ese caso conviene saberlo antes de las 00:20.

displayName: "EOD - Tareas por inversor con muchos fallos"
documentation:
  content: "Más de 10 errores/min en eodUserPerformanceTask. Revisar que marketData/eod/dates/{fecha} exista y el throughput de Firestore."
  mimeType: "text/markdown"
conditions:
  - displayName: "Error rate > 10/min"
    conditionThreshold:
      filter: >
        resource.type="cloud_function"
        AND resource.labels.function_name="eodUserPerformanceTask"
        AND severity="ERROR"
      comparison: COMPARISON_GT
      thresholdValue: 10
      duration: "300s"
      aggregations:
        - alignmentPeriod: "60s"
          perSeriesAligner: ALIGN_RATE
combiner: OR
enabled: true
